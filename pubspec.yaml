name: prompt_lab_ai
description: Локальная AI-платформа для создания промтов и базы знаний.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^10.3.7
  http: ^1.6.0
  html: ^0.15.6
  flutter_secure_storage: ^9.2.4
  llama_flutter_android: ^0.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
